name: build-code-server-image

# Builds LabPod's managed Code Server image and pushes it to
# ghcr.io/labpod/code-server:latest. The image is LabPod-owned so it can leave
# UID 1000 free for the workspace owner's injected passwd entry.
# Existing GHCR package access and public-visibility setup are documented in
# the repository README.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'images/code-server/**'
      - '.github/workflows/build-code-server-image.yml'
  push:
    branches: [main]
    paths:
      - 'images/code-server/**'
      - '.github/workflows/build-code-server-image.yml'
  schedule:
    - cron: '27 4 * * 1'

concurrency:
  group: build-code-server-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: images/code-server
          file: images/code-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/labpod/code-server:latest
